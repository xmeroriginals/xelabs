    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background-color: #1a1a1a;

      }
      .navbar {
        position: sticky;
        top: 20px;
        z-index: 100;
        background-color: #4444447d;
        border-radius: 999px;
        padding: 10px 20px;
        margin-bottom: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-left: 13px;
      }
      .navbar .left {
        flex: 1 1 0%;
        display: flex;
        align-items: center;
      }
      .navbar span {
        font-size: 28px;
        font-weight: bold;
      }
      .navbar .xe {
        color: red;
      }
      .navbar .labs {
        color: white;
      }
      .navbar .logo {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        overflow: hidden;
        background-color: transparent;
        margin-right: 10px;
      }
      .navbar .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .navbar .right a {
        color: white;
        text-decoration: none;
        font-size: 14px;
        background-color: red;
        padding: 8px 12px;
        border-radius: 999px;
        transition: background-color 0.3s;
        margin-left: 10px;
      }
      .navbar .right a:hover {
        background-color: #c00;
      }
      .library {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }
      .plugin-card {
        background-color: #1e1e1e;
        border: 2px solid #4444447d;
        border-radius: 20px;
        padding: 20px;
        position: relative;
        transition: transform 0.3s;
        display: flex;
        flex-direction: column;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      .plugin-card.fade-in {
        opacity: 1;
        transform: translateY(0);
      }
      .plugin-card:hover {
        transform: scale(1.03);
      }
      .plugin-image {
        width: 100%;
        height: 150px;
        background-color: #333;
        border-radius: 10px;
        margin-bottom: 15px;
      }
      .plugin-title {
        font-size: 20px;
        margin-bottom: 10px;
        text-align: center;
      }
      .plugin-desc {
        font-size: 13px;
        color: #bbb;
        text-align: center;
        margin-bottom: 30px;
      }
      .new-tag {
        position: absolute;
        top: 15px;
        right: 15px;
        background-color: red;
        color: white;
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 10px;
        font-weight: bold;
      }
      .plugin-card.new-card {
        border-color: #ff0000;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
      }
      .plugin-card.update-card {
        border-color: #007bff;
        box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
      }
      .plugin-btn {
        display: block;
        margin: 15px auto 0;
        background-color: red;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 999px;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition: background-color 0.3s;
        width: fit-content;
        margin-top: auto;
      }
      .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: #1c1c1e;
        padding: 20px;
        box-shadow: 0 -0.5px 99px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 999;
      }
      .footer .nav,
      .footer {
        display: flex;
        flex-wrap: center;
        justify-content: center;
        gap: 15px;
      }
      .footer .divider {
        margin: 0 20px;
        border: 2px solid #3d3d3d;
        height: 2px;
        width: 100px;
      }
      .nav {
        color: #cfcfcf;
      }
      .update-tag {
        position: absolute;
        top: 15px;
        right: 15px;
        background-color: #007bff;
        color: white;
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 10px;
        font-weight: bold;
        box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
      }
      .divider {
        position: relative;
        top: 8px;
        border-radius: 5px;
      }
      .footer .nav a,
      .footer a {
        color: #aaa;
        text-decoration: none;
        transition: color 0.3s;
      }
      .footer .nav a:hover,

      .footer {

      }
      .info {

      }
      .footer .info {
        font-size: 13px;
        color: #666;
      }
      .plugin-btn:hover {
        background-color: #c00;
      }
      ::-webkit-scrollbar {

      }

      .xelabsoriginals-tag {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        overflow: hidden;

  <body>
    <div class="navbar">
      <div class="left">
        <div class="logo">
          <img
            src="https://xmeroriginals.github.io/xelabs/assets/XeLabsLogo.png"
            alt="Logo"
          />
        </div>
        <span class="xe">Xe</span><span class="labs">Labs</span>

        <a href="https://scratch.mit.edu/users/XmerOriginals/">Scratch</a>
      </div>
    </div>

    <div class="library" id="pluginContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script>
      const notyf = new Notyf({
        duration: 3000,
        position: {
          x: "center",
          y: "bottom",
        },
        types: [
          {
            type: "info",
            background: "#00b3ff",
            icon: false,
            dismissible: true,
          },
          {
            type: "success",
            background: "#28a745",
            icon: false,
            dismissible: true,
          },
        ],
      });

      fetch("./get/extensions.json")
        .then((response) => response.json())
        .then(async (files) => {
          const container = document.getElementById("pluginContainer");

          const pluginDataList = await Promise.all(
            files.map(async (file) => {
              try {
                const res = await fetch(file);
                const text = await res.text();
                const lines = text
                  .split("\n")
                  .filter((line) => line.trim().startsWith("//"));

                let plugin = {
                  name: "Undefined",
                  description: "Undefined",
                  link: file,
                  new: false,
                  update: false,
                  author: null,
                };

                lines.forEach((line) => {
                  const content = line.replace("//", "").trim();
                  if (content.startsWith("Name:")) {
                    plugin.name = content.replace("Name:", "").trim();
                  } else if (content.startsWith("Description:")) {
                    plugin.description = content
                      .replace("Description:", "")
                      .trim();
                  } else if (content.toLowerCase().includes("new")) {
                    plugin.new = true;
                  } else if (content.toLowerCase().includes("update")) {
                    plugin.update = true;
                  } else if (content.startsWith("Image:")) {
                    const img = content.replace("Image:", "").trim();
                    if (img) plugin.image = img;
                  } else if (content.startsWith("Author:")) {
                    plugin.author = content.replace("Author:", "").trim();
                  }
                });

                return plugin;
              } catch (err) {
                console.error("Failed to load plugin:", file, err);
                return null;
              }
            })
          );

          pluginDataList.filter(Boolean).forEach((plugin, index) => {
            setTimeout(() => {
              const card = document.createElement("div");
              card.className = "plugin-card";

              let tagHTML = "";
              let xelabsoriginalsTagHTML = "";

              if (plugin.new) {
                card.classList.add("new-card");
                tagHTML = '<div class="new-tag">NEW</div>';
              } else if (plugin.update) {
                card.classList.add("update-card");
                tagHTML = '<div class="update-tag">UPDATE</div>';
              }

              if (plugin.author === "XmerOriginals") {
                xelabsoriginalsTagHTML = `
                <div class="xelabsoriginals-tag">
                  <img src="./assets/xelabsoriginal.svg" alt="xelabsoriginals" title="XeLabs Original Extension">
                </div>
              `;
              }

              card.innerHTML = `
              ${xelabsoriginalsTagHTML}
              <div class="plugin-image" style="background-image: url('${plugin.image}'); background-size: cover;"></div>
              <div class="plugin-title">${plugin.name}</div>
              <div class="plugin-desc">${plugin.description}</div>
              ${tagHTML}
              <div class="code-buttons">
                <a href="${plugin.link}" target="_blank">View Code</a>
                <button data-url="${plugin.link}">Copy Code</button>
              </div>
            `;

              container.appendChild(card);
              if (plugin.author === "XmerOriginals") {
                card
                  .querySelector(".xelabsoriginals-tag")
                  .addEventListener("click", () => {
                    notyf.open({
                      type: "info",
                      message: "XeLabs Original Extension",
                    });
                  });
              }
              card
                .querySelector("button[data-url]")
                .addEventListener("click", async (event) => {
                  const url = event.target.dataset.url;
                  try {
                    const response = await fetch(url);
                    const code = await response.text();
                    await navigator.clipboard.writeText(code);
                    notyf.open({
                      type: "success",
                      message: "Code copied to clipboard.",
                    });
                  } catch (error) {
                    console.error("Failed to copy code:", error);
                    notyf.error("Failed to copy code.");
                  }
                });

              setTimeout(() => {
                card.classList.add("fade-in");
              }, 50);
            }, index * 100);
          });
        })
        .catch((err) => {
          console.error("Error loading extensions.json:", err);
        });
    </script>
