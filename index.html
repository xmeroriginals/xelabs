<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="https://xmeroriginals.github.io/xelabs/assets/XeLabsLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XeLabs | Advanced Extensions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      color: #fff;
      padding: 20px;
      overflow-x: hidden;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #4444447d;
      border-radius: 999px;
      padding: 10px 20px;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
	  padding-top: 10px;
      padding-right: 20px;
      padding-bottom: 10px;
      padding-left: 13px;
    }

    .navbar .left,
	  flex: 1 1 0%;
      display: inline-block;
      align-self: center;
    .navbar .center,
    .navbar .right {
      display: flex;
      align-items: center;
	  
    }

    .navbar .center {
      flex-grow: 1;
      justify-content: center;
    }

    .navbar span {
      font-size: 28px;
      font-weight: bold;
    }

    .navbar .xe {
      color: red;
    }

    .navbar .labs {
      color: white;
    }

    .navbar .logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      background-color: transparent;
      margin-right: 10px;
    }

    .navbar .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .navbar .right a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      background-color: red;
      padding: 8px 12px;
      border-radius: 999px;
      transition: background-color 0.3s;
      margin-left: 10px;
    }

    .navbar .right a:hover {
      background-color: #c00;
    }

    .library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .plugin-card {
      background-color: #1e1e1e;
      border: 2px solid #4444447d;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      transition: transform 0.3s;
    }

    .plugin-card:hover {
      transform: scale(1.03);
    }

    .plugin-image {
      width: 100%;
      height: 150px;
      background-color: #333;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .plugin-title {
      font-size: 20px;
      margin-bottom: 10px;
      text-align: center;
    }

    .plugin-desc {
      font-size: 13px;
      color: #bbb;
      text-align: center;
	  margin-bottom: 30px;
    }

    .new-tag {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: red;
      color: white;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 10px;
      font-weight: bold;
    }

    .plugin-card.new-card {
      border-color: #ff0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    }

    .plugin-btn {
      display: block;
      margin: 15px auto 0;
      background-color: red;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s;
      width: fit-content;
    }

    .plugin-btn:hover {
      background-color: #c00;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: red;
	  border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="left">
      <div class="logo">
        <img src="https://xmeroriginals.github.io/xelabs/assets/XeLabsLogo.png" alt="Logo">
      </div>
    </div>
    <div class="center">
      <span class="xe">Xe</span><span class="labs">Labs</span>
    </div>
    <div class="right">
      <a href="https://scratch.mit.edu/users/XmerOriginals/">Scratch</a>
    </div>
  </div>

  <div class="library" id="pluginContainer">
  </div>

  <script>
    fetch('https://xmeroriginals.github.io/xelabs/extensions/extensions.json')
      .then(response => response.json())
      .then(plugins => {
        const container = document.getElementById('pluginContainer');

        plugins.forEach(plugin => {
          const card = document.createElement('div');
          card.className = 'plugin-card';
          if (plugin.new) card.classList.add('new-card');

          card.innerHTML = `
            <div class="plugin-image" style="background-image: url('${plugin.image || ''}'); background-size: cover;"></div>
            <div class="plugin-title">${plugin.title}</div>
            <div class="plugin-desc">${plugin.description}</div>
            ${plugin.new ? '<div class="new-tag">NEW</div>' : ''}
            <a class="plugin-btn" href="${plugin.link}" target="_blank">Code</a>
          `;

          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Error ', err);
      });
  </script>
</body>
</html>
